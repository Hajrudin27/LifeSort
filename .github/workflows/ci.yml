name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: TypeScript, Jest and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Migration fixtures verify source snapshots from historical commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --watchman=false
      - name: Require an ADR for governed changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run check:adr -- "$BASE_REF"

  database:
    name: PostgreSQL regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install local PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Run isolated database harnesses
        # Each harness starts/stops its own scratch cluster; no hosted DB or secrets.
        run: node --test tests/db/*.test.cjs
