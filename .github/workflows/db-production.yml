name: Deploy Migrations to Production

# Pushes the pending files in supabase/migrations to the LifeSort Production project.
# Manual only, from main, with a typed confirmation, behind the protected `production` GitHub
# environment. Nothing starts this workflow automatically. Runbook: docs/database-deployment.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_PRODUCTION (exactly) to confirm'
        required: true
        type: string

permissions:
  contents: read

env:
  # Explicit and pinned: without a version the setup action would pick the newest release.
  SUPABASE_CLI_VERSION: '2.116.0'

# One Production database deployment at a time, and an in-flight migration is never cancelled.
concurrency:
  group: database-production
  cancel-in-progress: false

defaults:
  run:
    # `bash -eo pipefail`: a failing command ends the step, including inside a pipeline.
    shell: bash

jobs:
  # Runs BEFORE the protected environment is requested, so a typo or a non-main branch fails at once
  # and no reviewer is asked to approve a run that could not deploy. It has no environment and no secrets.
  guard:
    name: Check the confirmation and the branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main and the exact confirmation
        env:
          # Passed through the environment, never interpolated into the script.
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production migrations deploy only from main (this run is on ${REF}). Nothing was deployed."
            exit 1
          fi
          if [ "$CONFIRM" != "DEPLOY_PRODUCTION" ]; then
            echo "::error::The confirmation did not match. Type DEPLOY_PRODUCTION exactly. Nothing was deployed."
            exit 1
          fi

  deploy:
    name: Push pending migrations to Production
    needs: guard
    # Defence in depth: even without the guard job, this job cannot start from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Configure Required reviewers on this environment (docs/database-deployment.md).
    environment: production
    env:
      # Not a secret. Environment-specific: Production and Staging hold different values.
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      # The commit main pointed at when the run was dispatched, which is the one the reviewer sees.
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: supabase

      - name: Confirm the checkout is exactly the dispatched commit
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$DEPLOY_SHA" ]; then
            echo "::error::Checked out ${actual}, but the run was dispatched at ${DEPLOY_SHA}. Nothing was deployed."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Confirm the installed Supabase CLI is the pinned version
        run: |
          installed="$(supabase --version 2>/dev/null)"
          if [ "$installed" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Supabase CLI ${installed} is installed, but ${SUPABASE_CLI_VERSION} is pinned."
            exit 1
          fi

      - name: Validate the Production configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Only presence and shape are checked; no value is printed. The project ref is an identifier, not a
          # credential: GitHub prints a step's env values (variables are never masked) in the log header, so it
          # is visible in this public repository's logs. The access token and password are secrets and are masked.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::The production environment needs the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD and the variable SUPABASE_PROJECT_ID. See docs/database-deployment.md."
            exit 1
          fi
          # Whole-string match in explicit characters: a line-based grep would accept a value with a
          # second line, and a range such as [a-z] depends on the locale.
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[abcdefghijklmnopqrstuvwxyz]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID must be a 20-letter lowercase project ref."
            exit 1
          fi

      - name: Link the Production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migration history before
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Dry run (nothing is applied)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # A diverged history, a missing migration or a connection failure fails this step, and no
          # later step runs after a failure.
          supabase db push --linked --skip-vault --dry-run 2>&1 | tee "${RUNNER_TEMP}/dry-run.txt"
          {
            echo '### Production dry run'
            echo "Commit: \`${DEPLOY_SHA}\`"
            echo '```'
            cat "${RUNNER_TEMP}/dry-run.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --yes answers the CLI's own "push these migrations?" prompt, which the dry run just showed.
        run: supabase db push --linked --skip-vault --yes

      - name: Migration history after
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
