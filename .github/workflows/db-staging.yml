name: Deploy Migrations to Staging

# Pushes the pending files in supabase/migrations to the LifeSort Staging project, automatically,
# and only for a commit on main whose CI run succeeded. Production is a separate, manual workflow
# (db-production.yml). Runbook: docs/database-deployment.md.
#
# Security model. `workflow_run` always executes the workflow file as it exists on the DEFAULT
# branch and has access to environment secrets, even when the run it reacts to came from a pull
# request. A change to this file in a pull request therefore has no effect until it is merged, and
# the job below is gated so that only a successful `push` CI run of this repository's own `main`
# can reach the secrets.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

env:
  # Explicit and pinned: without a version the setup action would pick the newest release.
  SUPABASE_CLI_VERSION: '2.116.0'

# One Staging deployment at a time, and an in-flight migration is never cancelled. Only runs that
# qualify for a deployment share the group: every CI completion (every pull request included)
# starts a run of this workflow, and an ignored run in the shared group could replace a pending
# deployment. Keep this expression identical to the job's `if`.
concurrency:
  group: >-
    ${{
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
      && 'database-staging'
      || format('database-staging-ignored-{0}', github.run_id)
    }}
  cancel-in-progress: false

defaults:
  run:
    # `bash -eo pipefail`: a failing command ends the step, including inside a pipeline.
    shell: bash

jobs:
  deploy:
    name: Push pending migrations to Staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      # Not a secret. Environment-specific: Staging and Production hold different values.
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      # The exact commit whose CI run succeeded. Never "whatever main points at now".
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Confirm the tested commit is still part of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # "ahead" or "identical" means main contains the tested commit. "diverged" or "behind"
          # means it no longer does (for example after a force-push), and it must not be deployed.
          status="$(gh api "repos/${REPOSITORY}/compare/${TESTED_SHA}...main" --jq '.status')"
          case "$status" in
            identical|ahead) echo "Tested commit ${TESTED_SHA} is part of main." ;;
            *)
              echo "::error::Tested commit ${TESTED_SHA} is not part of main (compare status: ${status}). Nothing was deployed."
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: supabase

      - name: Confirm the checkout is exactly the tested commit
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$TESTED_SHA" ]; then
            echo "::error::Checked out ${actual}, but CI tested ${TESTED_SHA}. Nothing was deployed."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Confirm the installed Supabase CLI is the pinned version
        run: |
          installed="$(supabase --version 2>/dev/null)"
          if [ "$installed" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Supabase CLI ${installed} is installed, but ${SUPABASE_CLI_VERSION} is pinned."
            exit 1
          fi

      - name: Validate the Staging configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Only presence and shape are checked; no value is printed. The project ref is an identifier, not a
          # credential: GitHub prints a step's env values (variables are never masked) in the log header, so it
          # is visible in this public repository's logs. The access token and password are secrets and are masked.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::The staging environment needs the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD and the variable SUPABASE_PROJECT_ID. See docs/database-deployment.md."
            exit 1
          fi
          # Whole-string match in explicit characters: a line-based grep would accept a value with a
          # second line, and a range such as [a-z] depends on the locale.
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[abcdefghijklmnopqrstuvwxyz]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID must be a 20-letter lowercase project ref."
            exit 1
          fi

      - name: Link the Staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migration history before
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Dry run (nothing is applied)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # A diverged history, a missing migration or a connection failure fails this step, and no
          # later step runs after a failure.
          supabase db push --linked --skip-vault --dry-run 2>&1 | tee "${RUNNER_TEMP}/dry-run.txt"
          {
            echo '### Staging dry run'
            echo "Commit: \`${TESTED_SHA}\`"
            echo '```'
            cat "${RUNNER_TEMP}/dry-run.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --yes answers the CLI's own "push these migrations?" prompt, which the dry run just showed.
        run: supabase db push --linked --skip-vault --yes

      - name: Migration history after
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
